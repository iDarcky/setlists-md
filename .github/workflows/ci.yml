name: CI

# The release train is feature branches → beta → main, so CI has to run on
# every push — gating only `main` would mean tests first run AFTER everything
# has already merged through beta.
on:
  push:
  pull_request:
    branches: [main, beta]

# A superseded push on the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
